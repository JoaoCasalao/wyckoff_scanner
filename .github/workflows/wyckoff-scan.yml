name: Wyckoff scan

on:
  schedule:
    # Mon-Fri 22:30 UTC, after the NYSE close (21:00 UTC in winter, 20:00 UTC in summer)
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      limit:
        description: "Scan only the first N tickers (0 = full NYSE universe)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: wyckoff-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        run: python wyckoff_scanner.py --limit "${{ inputs.limit || '0' }}"

      - name: Check news for picks
        run: python news_check.py

      - name: Update signal experiment
        run: python signal_tracker.py
        continue-on-error: true

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: wyckoff-reports-${{ github.run_id }}
          path: |
            wyckoff_reports/*.html
            wyckoff_reports/*.csv
            wyckoff_reports/*.json
            experiment/*
          retention-days: 30

      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add wyckoff_reports/*.html wyckoff_reports/*.csv wyckoff_reports/*.json experiment/
          if git diff --cached --quiet; then
            echo "No new reports to commit"
          else
            git commit -m "Wyckoff reports $(date -u +%F)"
            git push
          fi
